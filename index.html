  <style>
    /* Opening animation (16 Nov 2026): a dawn pond. Blush sky into willow, a soft light, and a lotus drawn petal by petal
       in 3D (js/lotus.js) rises from the water as a closed bud, then every ring of petals opens in turn. Then the name. */
    #splash { position: fixed; inset: 0; z-index: 9999; overflow: hidden; background: linear-gradient(180deg, #f8e9ec 0%, #f7ddd5 38%, #f2e2c8 62%, #d7d9b6 84%, #c3c9a0 100%); transition: opacity .8s ease, visibility .8s; }
    #splash.out { opacity: 0; visibility: hidden; }
    #splash::before { content: ''; position: absolute; left: -20%; right: -20%; top: 14%; height: 52%; background: radial-gradient(closest-side, rgba(255,250,244,.95), rgba(255,236,232,.45) 55%, transparent); opacity: 0; animation: spFade 2s .4s forwards; }
    #splash canvas { position: absolute; left: 0; right: 0; top: 20%; width: 100%; height: 46%; }
    #splash canvas.sx-rf { transform-origin: 50% 81.3%; transform: scaleY(-.55); opacity: 0; filter: blur(3px); }
    #splash .sx-water { position: absolute; left: 0; right: 0; top: 57.4%; height: 0; }
    #splash .sx-rip { position: absolute; left: 50%; top: 0; width: 60px; height: 10px; margin: -5px 0 0 -30px; border-radius: 50%; border: 1px solid rgba(255,255,255,.85); opacity: 0; animation: spRip 3.6s cubic-bezier(.2,.6,.3,1) forwards; }
    #splash .sx-rip:nth-child(1) { animation-delay: .1s; } #splash .sx-rip:nth-child(2) { animation-delay: .6s; } #splash .sx-rip:nth-child(3) { animation-delay: 1.1s; }
    #splash .sx-wm { position: absolute; left: 0; right: 0; top: 66%; text-align: center; color: #304023; font-family: 'Outfit', system-ui, sans-serif; opacity: 0; animation: spWord 1.2s 2.7s cubic-bezier(.2,.7,.2,1) forwards; }
    #splash .sx-wm b { display: block; font-weight: 300; font-size: 30px; letter-spacing: .42em; text-indent: .42em; }
    #splash .sx-wm span { display: block; margin-top: 12px; font-size: 11px; font-weight: 400; letter-spacing: .34em; text-indent: .34em; text-transform: uppercase; opacity: .62; }
    #splash .sx-prog { position: absolute; left: 50%; bottom: 9%; width: 44px; height: 1.5px; margin-left: -22px; border-radius: 2px; overflow: hidden; background: rgba(48,64,35,.14); opacity: 0; animation: spFade .6s 3.2s forwards; }
    #splash .sx-prog i { position: absolute; inset: 0; background: #304023; transform-origin: 0 50%; transform: scaleX(0); animation: spProg 1.4s 3.2s ease-in-out forwards; }
    @keyframes spFade { to { opacity: 1; } }
    @keyframes spProg { to { transform: scaleX(1); } }
    @keyframes spRip { 0% { opacity: 0; transform: scale(.4); } 12% { opacity: .9; } 100% { opacity: 0; transform: scale(5.2); } }
    @keyframes spWord { from { opacity: 0; transform: translateY(10px); letter-spacing: .2em; filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
    @media (prefers-reduced-motion: reduce) {
      #splash *, #splash::before { animation: none !important; transition: none !important; }
      #splash::before, #splash .sx-wm, #splash .sx-prog { opacity: 1; } #splash .sx-rip { display: none; }
    }
  </style>

<body>
<div id="splash" role="img" aria-label="Underskin is opening">
  <div class="sx-water" aria-hidden="true"><i class="sx-rip"></i><i class="sx-rip"></i><i class="sx-rip"></i></div>
  <canvas class="sx-rf" aria-hidden="true"></canvas><canvas class="sx-lo" aria-hidden="true"></canvas>
  <div class="sx-wm"><b>underskin</b><span>your cycle, your seasons</span></div><div class="sx-prog"><i></i></div>
</div>
<script src="js/lotus.js"></script>
<script>
  // The bud rises from the water (0.2 to 1.1 s), then the petals open ring by ring (1.0 to 3.6 s).
  (function () {
    var cv = document.querySelector('#splash .sx-lo'), rf = document.querySelector('#splash .sx-rf'); if (!cv || !cv.getContext || !window.Lotus) return;
    var L = Lotus(cv, { size: .5 }), R = Lotus(rf, { size: .5 }), calm = matchMedia('(prefers-reduced-motion: reduce)').matches, t0 = performance.now();
    function frame(now) {
      var ms = calm ? 9999 : now - t0, rise = Lotus.easeOut(Lotus.clamp((ms - 200) / 900)), e = Lotus.clamp((ms - 1000) / 2600), ee = e * e * (3 - 2 * e);
      cv.style.opacity = Lotus.clamp(rise * 1.6); cv.style.transform = 'translateY(' + ((1 - rise) * 18) + 'px)';
      L.render(ee, ms, { cy: .81 }); R.render(ee, ms, { cy: .81 }); rf.style.opacity = .1 * rise;
      if (!calm && document.getElementById('splash')) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
</script>
<script>
  // stays at least until the lotus has opened, and until the app has drawn its first screen
  (function () {
    var t0 = Date.now(), calm = matchMedia('(prefers-reduced-motion: reduce)').matches, min = calm ? 450 : 4900, done = false;
    function hide() { if (done) return; done = true; var el = document.getElementById('splash'); if (!el) return;
      setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 650); }, Math.max(0, min - (Date.now() - t0))); }
    window.__appReady = hide;
    setTimeout(hide, 8000); // never trap her behind it
  })();
</script>
