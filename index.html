  <style>
    /* Opening animation (16 Nov 2026, her mix of 1 and 2): the dawn sky, a pearl arched window that draws itself,
       a 3D lotus (js/lotus.js) rising as a bud and opening on still water with its mirror image below, then the name
       in a light italic serif, letter by letter, over a hairline with a spark. */
    @font-face { font-family: 'Ballet'; font-style: normal; font-weight: 400; font-display: block; src: url(fonts/ballet-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: 'Ballet'; font-style: normal; font-weight: 400; font-display: block; src: url(fonts/ballet-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    #splash { position: fixed; inset: 0; z-index: 9999; overflow: hidden; background: linear-gradient(180deg, #f8e9ec 0%, #f7ddd5 38%, #f2e2c8 62%, #d7d9b6 84%, #c3c9a0 100%); transition: opacity .35s ease, visibility .35s; }
    #splash.out { opacity: 0; visibility: hidden; }
    #splash::before { content: ''; position: absolute; left: -20%; right: -20%; top: 12%; height: 52%; background: radial-gradient(closest-side, rgba(255,250,244,.95), rgba(255,236,232,.45) 55%, transparent); opacity: 0; animation: spFade .72s .09s forwards; }
    #splash .sx-arch { position: absolute; left: 7%; top: 7%; width: 86%; height: 100%; overflow: visible; }
    #splash .sx-arch path { fill: rgba(255,251,250,.42); fill-opacity: 0; stroke: rgba(140,151,104,.85); stroke-width: 1.1; stroke-dasharray: 2600; stroke-dashoffset: 2600; vector-effect: non-scaling-stroke; animation: spDraw .9s .03s cubic-bezier(.5,.1,.3,1) forwards, spFill .6s .42s forwards; }
    #splash .sx-arch path.in { fill: none; stroke: rgba(140,151,104,.42); stroke-width: .8; animation-delay: .12s, 0s; }
    #splash canvas { position: absolute; left: 0; right: 0; top: 19%; width: 100%; height: 44%; }
    #splash canvas.sx-rf { transform-origin: 50% 81%; transform: scaleY(-.66); opacity: 0; filter: blur(1.1px) saturate(.9);
      -webkit-mask-image: linear-gradient(to bottom, transparent 18%, rgba(0,0,0,.55) 62%, #000 81%); mask-image: linear-gradient(to bottom, transparent 18%, rgba(0,0,0,.55) 62%, #000 81%); }
    #splash .sx-water { position: absolute; left: 0; right: 0; top: 54.6%; height: 0; }
    #splash .sx-wl { position: absolute; left: 50%; top: 0; width: 70%; height: 1px; margin-left: -35%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.95) 30% 70%, transparent); transform: scaleX(0); animation: spProg .66s .18s cubic-bezier(.4,.1,.2,1) forwards; }
    #splash .sx-sh { position: absolute; left: 50%; height: 1px; border-radius: 1px; background: rgba(255,255,255,.75); opacity: 0; animation: spSh 3.2s ease-in-out infinite; }
    #splash .sx-rip { position: absolute; left: 50%; top: 0; width: 60px; height: 10px; margin: -5px 0 0 -30px; border-radius: 50%; border: 1px solid rgba(255,255,255,.85); opacity: 0; animation: spRip 2.16s cubic-bezier(.2,.6,.3,1) forwards; }
    #splash .sx-rip:nth-of-type(1) { animation-delay: .06s; } #splash .sx-rip:nth-of-type(2) { animation-delay: .36s; } #splash .sx-rip:nth-of-type(3) { animation-delay: .66s; }
    #splash .sx-wm { position: absolute; left: 0; right: 0; top: 57.5%; display: grid; justify-items: center; text-align: center; }
    #splash .sx-name { position: relative; display: block; font: 400 min(112px, 29vw)/1.15 'Ballet', 'Cormorant Garamond', Georgia, serif; font-optical-sizing: auto; letter-spacing: 0; white-space: nowrap; color: #7e3452; transform: translateY(10px); animation: spRise .84s .57s cubic-bezier(.25,.8,.3,1) forwards; }
    /* ink: the word is written left to right by a feathered edge. Outer layer slides in, inner text slides back the same amount, so only transforms run (compositor, no repaint) */
    #splash .sx-ink { display: block; margin-right: -.7em; -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - .85em), transparent); mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - .85em), transparent); transform: translateX(-100%); will-change: transform; animation: spInk .66s .6s cubic-bezier(.55,.12,.3,1) forwards; }
    #splash .sx-ink > span { display: block; padding: .18em .9em .22em .2em; text-shadow: 0 0 22px rgba(255,246,240,.9); transform: translateX(100%); will-change: transform; animation: spInkBack .66s .6s cubic-bezier(.55,.12,.3,1) forwards; }
    /* a pearl glint rides the writing edge, then melts away */
    #splash .sx-pen { position: absolute; left: 0; top: 0; bottom: 0; right: -.7em; pointer-events: none; transform: translateX(-100%); will-change: transform; animation: spInk .66s .6s cubic-bezier(.55,.12,.3,1) forwards; }
    #splash .sx-pen::before { content: ''; position: absolute; right: .5em; top: 50%; width: .5em; height: .5em; margin-top: -.18em; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,1), rgba(255,226,236,.75) 40%, rgba(231,160,190,0)); opacity: 0; animation: spGlint .66s .6s ease forwards; }
    /* when the ink has dried the word takes a soft pearly breath */
    #splash .sx-glow { position: absolute; inset: 0; z-index: -1; display: block; margin-right: -.7em; padding: .18em .9em .22em .2em; color: transparent; text-shadow: 0 0 18px rgba(255,214,228,.95), 0 0 42px rgba(255,236,226,.8); opacity: 0; pointer-events: none; animation: spBloom .96s 1.17s ease-in-out forwards; }
    #splash .sx-tm { position: absolute; right: .9em; top: 5.6em; font: 400 11px/1 'Outfit', system-ui, sans-serif; color: rgba(126,52,82,.7); opacity: 0; animation: spFade .3s 1.2s forwards; }
    #splash .sx-line { position: relative; width: 150px; height: 9px; margin: 2px 0 12px; }
    #splash .sx-line::before { content: ''; position: absolute; left: 0; right: 0; top: 4px; height: 1px; background: linear-gradient(90deg, transparent, rgba(126,52,82,.5) 25% 75%, transparent); transform: scaleX(0); animation: spProg .42s 1.11s cubic-bezier(.4,.1,.2,1) forwards; }
    #splash .sx-line::after { content: ''; position: absolute; left: 50%; top: 0; width: 9px; height: 9px; margin-left: -4.5px; background: #c7708f; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); opacity: 0; transform: scale(0) rotate(-45deg); animation: spStar .36s 1.29s cubic-bezier(.3,1.6,.5,1) forwards; }
    #splash .sx-tag { font: italic 300 17px/1.2 'Cormorant Garamond', Georgia, serif; letter-spacing: .03em; color: rgba(48,64,35,.85); opacity: 0; animation: spWord .42s 1.2s ease forwards; }
    #splash .sx-prog { position: absolute; left: 50%; bottom: 7%; width: 44px; height: 1.5px; margin-left: -22px; border-radius: 2px; overflow: hidden; background: rgba(48,64,35,.14); opacity: 0; animation: spFade .36s 2.04s forwards; }
    #splash .sx-prog i { position: absolute; inset: 0; background: #304023; transform-origin: 0 50%; transform: scaleX(0); animation: spProg .48s 1.02s ease-in-out forwards; }
    @keyframes spFade { to { opacity: 1; } }
    @keyframes spProg { to { transform: scaleX(1); } }
    @keyframes spDraw { to { stroke-dashoffset: 0; } }
    @keyframes spFill { to { fill-opacity: 1; } }
    @keyframes spRip { 0% { opacity: 0; transform: scale(.4); } 12% { opacity: .9; } 100% { opacity: 0; transform: scale(5.2); } }
    @keyframes spSh { 0%, 100% { opacity: 0; transform: translateX(-50%) scaleX(.4); } 50% { opacity: .8; transform: translateX(-50%) scaleX(1); } }
    @keyframes spWord { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes spRise { to { transform: none; } }
    @keyframes spInk { to { transform: none; } }
    @keyframes spInkBack { to { transform: none; } }
    @keyframes spGlint { 0%, 16% { opacity: 0; } 30% { opacity: 1; } 78% { opacity: .9; } 100% { opacity: 0; } }
    @keyframes spBloom { 0% { opacity: 0; } 45% { opacity: 1; } 100% { opacity: .45; } }
    @keyframes spStar { to { opacity: 1; transform: scale(1) rotate(0); } }
    @media (prefers-reduced-motion: reduce) {
      #splash *, #splash::before, #splash *::before, #splash *::after { animation: none !important; transition: none !important; }
      #splash::before, #splash .sx-tag, #splash .sx-prog, #splash .sx-line::after { opacity: 1; transform: none; filter: none; }
      #splash .sx-name, #splash .sx-ink, #splash .sx-ink > span { transform: none; } #splash .sx-pen { display: none; } #splash .sx-glow { opacity: .45; } #splash .sx-tm { opacity: 1; }
      #splash .sx-arch path { stroke-dashoffset: 0; fill-opacity: 1; } #splash .sx-line::before, #splash .sx-wl { transform: none; } #splash .sx-rip, #splash .sx-sh { display: none; }
    }

<script>
  // The bud rises from the water (0.06 to 0.42 s), then the petals open ring by ring (0.27 to 1.17 s).
  (function () {
    var cv = document.querySelector('#splash .sx-lo'), rf = document.querySelector('#splash .sx-rf'); if (!cv || !cv.getContext || !window.Lotus) return;
    var L = Lotus(cv, { size: .43 }), R = Lotus(rf, { size: .43 }), calm = matchMedia('(prefers-reduced-motion: reduce)').matches, t0 = performance.now();
    function frame(now) {
      var ms = calm ? 9999 : now - t0, rise = Lotus.easeOut(Lotus.clamp((ms - 60) / 360)), e = Lotus.clamp((ms - 270) / 900), ee = e * e * (3 - 2 * e);
      cv.style.opacity = Lotus.clamp(rise * 1.6); cv.style.transform = 'translateY(' + ((1 - rise) * 18) + 'px)';
      L.render(ee, ms, { cy: .81 }); R.render(ee, ms, { cy: .81 }); rf.style.opacity = .3 * rise;
      if (!calm && document.getElementById('splash')) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
</script>
<script>
  // stays at least until the lotus has opened, and until the app has drawn its first screen
  (function () {
    var t0 = Date.now(), calm = matchMedia('(prefers-reduced-motion: reduce)').matches, min = calm ? 250 : 1650, done = false;
    function hide() { if (done) return; done = true; var el = document.getElementById('splash'); if (!el) return;
      setTimeout(function () { el.classList.add('out'); try { performance.mark('uts-splash-out'); } catch (e) {} setTimeout(function () { el.remove(); }, 380); }, Math.max(0, min - (Date.now() - t0))); }
    window.__appReady = hide;
    setTimeout(hide, 6000); // never trap her behind it
  })();
</script>
