  <style>
    /* Opening animation: a pink lotus rises on its pad, opens petal by petal on a soft dusk sky (mauve to peach), then the name in white */
    #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background:
      radial-gradient(46% 26% at 50% 42%, rgba(255, 240, 244, .42), transparent 72%),
      radial-gradient(90% 40% at 50% 100%, rgba(255, 214, 190, .55), transparent 70%),
      linear-gradient(180deg, #8c6a86 0%, #b4889a 48%, #dcaa9f 100%);
      transition: opacity .55s ease, visibility .55s; }
    #splash.out { opacity: 0; visibility: hidden; }
    #splash .sp { display: grid; justify-items: center; gap: 16px; transform: translateY(-4vh); transition: transform .55s cubic-bezier(.2,.8,.2,1); }
    #splash.out .sp { transform: translateY(-4vh) scale(1.05); }
    #splash svg { width: 210px; height: 178px; overflow: visible; }
    #splash .rip { fill: none; stroke: rgba(255,255,255,.22); stroke-width: 1; transform-origin: 100px 132px; transform: scale(.4); opacity: 0; animation: lpRip 2.4s ease-out forwards; }
    #splash .rip.r2 { animation-delay: .5s; } #splash .rip.r3 { animation-delay: 1s; }
    #splash .pad { transform-origin: 100px 132px; transform: scale(.6); opacity: 0; animation: lpPad .7s .05s cubic-bezier(.2,.9,.3,1) forwards; }
    #splash .fl { transform-origin: 100px 126px; transform: translateY(14px) scale(.7); opacity: 0; animation: lpRise .6s .2s cubic-bezier(.2,.9,.3,1) forwards, lpBob 3.6s 1.8s ease-in-out infinite; }
    #splash .pt { transform-origin: 0 0; transform: rotate(calc(var(--r) * .1)) scaleY(.92); animation: lpOpen 1s var(--d) cubic-bezier(.35,.85,.3,1) forwards; }
        #splash .wm { font-family: 'Yellowtail', 'Brush Script MT', cursive; font-weight: 400; font-size: 46px; line-height: 1; letter-spacing: .01em; color: #fff; text-shadow: 0 2px 16px rgba(90,50,80,.35); margin-top: -4px; opacity: 0; animation: spWord .7s 1.2s ease forwards; }
    #splash .bar { width: 64px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.14); overflow: hidden; opacity: 0; animation: spWord .4s 1.45s ease forwards; }
    #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #efd4dd; animation: spBar 1.2s 1.45s ease-in-out infinite; }
    @keyframes lpRip { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.25); } }
    @keyframes lpPad { to { opacity: 1; transform: none; } }
    @keyframes lpRise { to { opacity: 1; transform: none; } }
    @keyframes lpBob { 50% { transform: translateY(-2.5px); } }
    @keyframes lpOpen { to { transform: rotate(var(--r)) scaleY(1); } }
    @keyframes lpPod { to { transform: scale(1); } }
    @keyframes spWord { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes spBar { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash *, #splash .fl, #splash .pt { animation: none !important; }
      #splash .pad, #splash .fl, #splash .pod, #splash .wm, #splash .bar { opacity: 1; transform: none; }
      #splash .pt { transform: rotate(var(--r)); } #splash .rip { opacity: 0; }
    }
  </style>

        <linearGradient id="lp-gf" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fffaf6"/><stop offset=".5" stop-color="#f8d9e3"/><stop offset="1" stop-color="#e48aaa"/></linearGradient>

      <ellipse class="rip" cx="100" cy="132" rx="88" ry="13"/><ellipse class="rip r2" cx="100" cy="132" rx="88" ry="13"/><ellipse class="rip r3" cx="100" cy="132" rx="88" ry="13"/>

      </g>
      <g class="fl"><g transform="translate(100 128)">
        <use href="#lp-b" class="pt" style="--r:-80deg;--d:0.45s"/><use href="#lp-b" class="pt" style="--r:80deg;--d:0.50s"/><use href="#lp-b" class="pt" style="--r:-58deg;--d:0.55s"/><use href="#lp-b" class="pt" style="--r:58deg;--d:0.60s"/><use href="#lp-b" class="pt" style="--r:-34deg;--d:0.65s"/><use href="#lp-b" class="pt" style="--r:34deg;--d:0.70s"/><use href="#lp-b" class="pt" style="--r:-12deg;--d:0.75s"/><use href="#lp-b" class="pt" style="--r:12deg;--d:0.80s"/>
        <use href="#lp-f" class="pt" style="--r:-16deg;--d:0.86s"/><use href="#lp-f" class="pt" style="--r:16deg;--d:0.92s"/>
        <use href="#lp-f" class="pt" style="--r:-62deg;--d:0.62s"/><use href="#lp-f" class="pt" style="--r:62deg;--d:0.68s"/><use href="#lp-f" class="pt" style="--r:-38deg;--d:0.74s"/><use href="#lp-f" class="pt" style="--r:38deg;--d:0.80s"/><use href="#lp-f" class="pt" style="--r:0deg;--d:0.98s"/>
      </g></g>
    </svg>
    <div class="wm">underskin</div>
    <div class="bar"><i></i></div>

<script>
  // stays at least until the lotus has opened, and until the app has drawn its first screen
  (function () {
    var t0 = Date.now(), calm = matchMedia('(prefers-reduced-motion: reduce)').matches, min = calm ? 450 : 1900, done = false;
    function hide() { if (done) return; done = true; var el = document.getElementById('splash'); if (!el) return;
      setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 650); }, Math.max(0, min - (Date.now() - t0))); }
    window.__appReady = hide;
    setTimeout(hide, 7000); // never trap her behind it
  })();
</script>
