  <style>
    /* Opening animation: the arched window of misty blush light. The frame settles, the willow strokes drift in,
       the lotus opens from its base with a soft glow and light rising from its stamens, the swirls draw upward,
       then the name. It ends on the same picture the app uses as its background, so it melts into the app. */
    #splash { position: fixed; inset: 0; z-index: 9999; overflow: hidden; background: #f0cfc2 url(images/bg/mist.webp) center / 100% 100% no-repeat; transition: opacity .8s ease, visibility .8s; }
    #splash.out { opacity: 0; visibility: hidden; }
    #splash i, #splash .sx-lotus { position: absolute; display: block; background-repeat: no-repeat; pointer-events: none; }
    #splash .sx-arch { inset: 0; background-image: url(images/bg/arch.webp); background-size: 100% 100%; opacity: 0; transform: scale(1.06); animation: sxArch 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
    #splash .sx-leaves { inset: 0; background-image: url(images/bg/leaves.webp); background-size: 100% 100%; transform-origin: 50% 0; opacity: 0; animation: sxLeaves 1.6s .25s ease-out forwards, sxSway 7s 1.85s ease-in-out infinite alternate; }
    #splash .sx-lotus { left: 12.27%; top: 11.75%; width: 75.46%; height: 25.6%; }
    #splash .sx-flower, #splash .sx-glow { inset: 0; background-image: url(images/bg/lotus.webp); background-size: contain; background-position: center; }
    #splash .sx-flower { transform-origin: 50% 82%; opacity: 0; transform: translateY(6%) scale(.55, .3); filter: blur(10px); animation: sxBloom 1.5s .35s cubic-bezier(.25,.85,.3,1) forwards, sxBob 5s 2s ease-in-out infinite; }
    #splash .sx-glow { transform: scale(1.08); filter: blur(16px) saturate(1.5) brightness(1.25); mix-blend-mode: screen; opacity: 0; animation: sxGlowIn 1s 1.1s ease forwards, sxGlow 3.2s 2.1s ease-in-out infinite; }
    #splash .sx-halo { left: 18%; right: 18%; top: 10%; bottom: -10%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,246,236,.95), rgba(255,214,222,.55) 45%, transparent 100%); opacity: 0; transform: scale(.4); animation: sxHalo 1.6s .6s ease-out forwards, sxGlow 3.2s 2.2s ease-in-out infinite; }
    #splash .sx-mote { width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; left: var(--x); top: var(--y); background: radial-gradient(circle, #fffaf0 0 30%, rgba(255,214,150,.85) 45%, transparent 72%); box-shadow: 0 0 10px 3px rgba(255,220,170,.55); opacity: 0; animation: sxMote 3.4s var(--d) ease-out infinite; }
    #splash .sx-swirls { left: 6.8%; top: 38.05%; width: 86.49%; height: 53.6%; background-image: url(images/bg/swirls.webp); background-size: contain; background-position: center;
      -webkit-mask: linear-gradient(to top, #000 42%, transparent 58%) 0 0 / 100% 260% no-repeat; mask: linear-gradient(to top, #000 42%, transparent 58%) 0 0 / 100% 260% no-repeat; animation: sxDraw 1.9s .5s cubic-bezier(.4,.1,.3,1) forwards; }
    #splash .sx-word { position: absolute; left: 0; right: 0; top: 37%; display: grid; justify-items: center; gap: 16px; }
    #splash .wm { font-family: 'Yellowtail', 'Brush Script MT', cursive; font-weight: 400; font-size: min(21vw, 84px); line-height: 1.05; letter-spacing: .01em; color: #7e3452; text-shadow: 0 0 16px rgba(255,247,240,.95), 0 0 42px rgba(255,236,226,.85), 0 1px 0 rgba(255,255,255,.6); opacity: 0; animation: spWord 1s 1.35s ease forwards; }
    #splash .bar { width: 64px; height: 2px; border-radius: 2px; background: rgba(126,52,82,.16); overflow: hidden; opacity: 0; animation: spWord .5s 1.7s ease forwards; }
    #splash .bar i { position: static; width: 40%; height: 100%; border-radius: 2px; background: rgba(126,52,82,.7); animation: spBar 1.2s 1.7s ease-in-out infinite; }
    #splash.out .sx-lotus { transition: transform .8s cubic-bezier(.2,.8,.2,1); transform: scale(1.04); }
    /* the lotus opens from a closed bud: drawn on a canvas, petals fold out from the base (script below) */
    #splash canvas.sx-flower { position: absolute; inset: 0; width: 100%; height: 100%; background: none; transform: none; filter: drop-shadow(0 0 14px rgba(255,236,226,.55)); opacity: 0; animation: sxIn .6s .2s ease forwards, sxBob 5s 4.2s ease-in-out infinite; }
    #splash .sx-glow { animation: sxGlowIn 1.2s 3.1s ease forwards, sxGlow 3.2s 4.3s ease-in-out infinite; }
    #splash .sx-halo { animation: sxHalo 2.2s 1.4s ease-out forwards, sxGlow 3.2s 3.6s ease-in-out infinite; }
    #splash .sx-mote { animation-delay: calc(var(--d) + 1.6s); }
    @keyframes sxIn { to { opacity: 1; } }
    @keyframes sxArch { to { opacity: 1; transform: none; } }
    @keyframes sxLeaves { from { opacity: 0; transform: translateY(-3%) rotate(-1deg); } to { opacity: 1; transform: none; } }
    @keyframes sxSway { from { transform: rotate(0); } to { transform: rotate(.6deg) translateX(.6%); } }
    @keyframes sxBloom { 55% { opacity: 1; filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }
    @keyframes sxBob { 50% { transform: translateY(-1.2%); } }
    @keyframes sxGlowIn { to { opacity: .75; } }
    @keyframes sxGlow { 0%, 100% { opacity: .5; } 50% { opacity: .95; } }
    @keyframes sxHalo { to { opacity: .8; transform: none; } }
    @keyframes sxMote { 0% { opacity: 0; transform: translateY(0) scale(.6); } 18% { opacity: 1; } 100% { opacity: 0; transform: translateY(-46px) scale(1.1); } }
    @keyframes sxDraw { to { -webkit-mask-position: 0 100%; mask-position: 0 100%; } }
    @keyframes spWord { from { opacity: 0; transform: translateY(8px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
    @keyframes spBar { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash *, #splash i { animation: none !important; transition: none !important; }
      #splash .sx-arch, #splash .sx-leaves, #splash .sx-flower, #splash .wm, #splash .bar { opacity: 1; transform: none; filter: none; }
      #splash .sx-glow { opacity: .6; } #splash .sx-halo { opacity: .7; transform: none; } #splash .sx-mote { display: none; }
      #splash .sx-swirls { -webkit-mask: none; mask: none; }
    }
  </style>

<body>
<div id="splash" role="img" aria-label="Underskin is opening">
  <i class="sx-leaves"></i>

  <i class="sx-swirls"></i>
  <i class="sx-arch"></i>
  <div class="sx-word"><div class="wm">underskin</div><div class="bar"><i></i></div></div>
</div>
<script>
  // The lotus opens: thin slices of her lotus fan out from the base, from a closed bud to full bloom.
  (function () {
    var cv = document.querySelector('#splash .sx-flower'); if (!cv || !cv.getContext) return;
    var calm = matchMedia('(prefers-reduced-motion: reduce)').matches, pet = new Image(), lin = new Image(), n = 0, last = -1;
    function go() {
      if (++n < 2) return;
      var r = cv.getBoundingClientRect(), dpr = Math.min(2.5, window.devicePixelRatio || 1);
      cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
      var ctx = cv.getContext('2d'), W = pet.width, H = pet.height, sc = Math.min(cv.width / W, cv.height / H), ox = (cv.width - W * sc) / 2, oy = (cv.height - H * sc) / 2;
      var px = 366 / 732 * W, py = 432 / 512 * H, N = 120, A = Math.PI * .6, d = 2 * A / N;
      // e: 0 closed bud, 1 full bloom. The outer petals fall open first, the inner ones follow; the flower lifts and grows as it opens.
      function draw(e, sw) {
        var key = e + ':' + (sw || 0); if (key === last) return; last = key;
        ctx.clearRect(0, 0, cv.width, cv.height); ctx.save(); ctx.translate(ox, oy); ctx.scale(sc, sc);
        var g = (.84 + .16 * e) * (1 + (sw || 0)); ctx.translate(px, py); ctx.scale(g, g); ctx.translate(-px, -py + (1 - e) * H * .05);
        for (var i = 0; i < N; i++) {
          var a0 = -A + i * d, am = a0 + d / 2, out = Math.abs(am) / A,
            ei = Math.max(0, Math.min(1, e * 1.45 - (1 - out) * .45)), ee = ei * ei * (3 - 2 * ei), k = .3 + .7 * ee,
            rs = 1 - (1 - ee) * (.08 + .3 * out * out);
          ctx.save(); ctx.translate(px, py); ctx.rotate(am * (k - 1)); ctx.scale(rs, rs);
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, W * 1.3, a0 - d * .7 - Math.PI / 2, a0 + d * 1.7 - Math.PI / 2); ctx.closePath(); ctx.clip();
          ctx.drawImage(pet, -px, -py); ctx.restore();
        }
        ctx.globalAlpha = Math.max(0, Math.min(1, (e - .7) / .3)); ctx.drawImage(lin, 0, 0); ctx.restore();
      }
      if (calm) { draw(1); return; }
      // the closed bud breathes for a moment, then the petals open slowly into full bloom
      var t0 = performance.now() + 300, hold = 650, dur = 3000;
      function f(now) { var u = now - t0, t = Math.max(0, Math.min(1, (u - hold) / dur)), e = .5 - Math.cos(Math.PI * t) / 2,
          sw = u < hold + 400 ? .025 * Math.sin(Math.max(0, u) / (hold + 400) * Math.PI) : 0;
        draw(e, sw); if (t < 1 && document.getElementById('splash')) requestAnimationFrame(f); }
      f(performance.now()); requestAnimationFrame(f);
      setTimeout(function () { draw(1); }, 4600); // a background webview may skip frames: always end in full bloom
    }
    pet.onload = lin.onload = go; pet.src = 'images/bg/lotus-petals.webp'; lin.src = 'images/bg/lotus-lines.webp';
  })();
</script>
<script>
  // stays at least until the lotus has opened, and until the app has drawn its first screen
  (function () {
    var t0 = Date.now(), calm = matchMedia('(prefers-reduced-motion: reduce)').matches, min = calm ? 450 : 4300, done = false;
    function hide() { if (done) return; done = true; var el = document.getElementById('splash'); if (!el) return;
      setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 650); }, Math.max(0, min - (Date.now() - t0))); }
    window.__appReady = hide;
    setTimeout(hide, 8000); // never trap her behind it
  })();
</script>
