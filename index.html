  <style>
    /* Opening animation: a hand-drawn sprout grows, two leaves open, a blush bud, then the name */
    #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background:
      radial-gradient(60% 34% at 18% 100%, rgba(255, 214, 190, .55), transparent 70%),
      radial-gradient(55% 30% at 82% 100%, rgba(208, 226, 160, .55), transparent 70%),
      radial-gradient(70% 40% at 50% 0%, rgba(239, 212, 221, .7), transparent 70%), #f6eef0;
      transition: opacity .55s ease, visibility .55s; }
    #splash.out { opacity: 0; visibility: hidden; }
    #splash .sp { display: grid; justify-items: center; gap: 14px; transform: translateY(-4vh); transition: transform .55s cubic-bezier(.2,.8,.2,1); }
    #splash.out .sp { transform: translateY(-4vh) scale(1.06); }
    #splash svg { width: 150px; height: 200px; overflow: visible; }
    #splash .sw { transform-origin: 60px 140px; animation: spSway 3.2s 1.5s ease-in-out infinite; }
    #splash .ln { fill: none; stroke: #304023; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
    #splash .soil { stroke: rgba(48,64,35,.35); stroke-width: 1.4; animation: spDraw .5s ease-out forwards; }
    #splash .stem { animation: spDraw .75s .2s cubic-bezier(.5,0,.3,1) forwards; }
    #splash .lf { fill: rgba(108,130,62,0); }
    #splash .l1 { animation: spDraw .5s .75s ease-out forwards, spFill .6s 1.05s ease forwards; }
    #splash .l2 { animation: spDraw .5s .9s ease-out forwards, spFill .6s 1.2s ease forwards; }
    #splash .bud { fill: #e6b1c4; transform-origin: 60px 64px; transform: scale(0); animation: spBud .55s 1.15s cubic-bezier(.3,1.6,.5,1) forwards; }
    #splash .bud2 { fill: #efd4dd; }
    #splash .wm { font-family: Outfit, -apple-system, 'Helvetica Neue', sans-serif; font-weight: 300; font-size: 26px; letter-spacing: .32em; text-indent: .32em; color: #20301a; opacity: 0; animation: spWord .7s 1.15s ease forwards; }
    #splash .bar { width: 64px; height: 2px; border-radius: 2px; background: rgba(48,64,35,.12); overflow: hidden; opacity: 0; animation: spWord .4s 1.4s ease forwards; }
    #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #6c823e; animation: spBar 1.2s 1.4s ease-in-out infinite; }
    @keyframes spDraw { to { stroke-dashoffset: 0; } }
    @keyframes spFill { to { fill: rgba(108,130,62,.85); } }
    @keyframes spBud { to { transform: scale(1); } }
    @keyframes spWord { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes spBar { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    @keyframes spSway { 50% { transform: rotate(2.2deg); } }
    @media (prefers-reduced-motion: reduce) {
      #splash *, #splash .sw { animation: none !important; }
      #splash .ln { stroke-dashoffset: 0; } #splash .lf { fill: rgba(108,130,62,.85); } #splash .bud { transform: none; } #splash .wm, #splash .bar { opacity: 1; }
    }
  </style>

<body>
<div id="splash" role="img" aria-label="Underskin is opening">
  <div class="sp">
    <svg viewBox="0 0 120 160" aria-hidden="true"><g class="sw">
      <path class="ln soil" pathLength="1" d="M34 140 C 48 137, 72 137, 86 140"/>
      <path class="ln stem" pathLength="1" d="M60 140 C 57 118, 63 96, 60 68"/>
      <path class="ln lf l1" pathLength="1" d="M59.5 108 C 46 107, 36 98, 33 86 C 46 85, 57 93, 59.5 108 Z"/>
      <path class="ln lf l2" pathLength="1" d="M60.5 92 C 73 89, 83 79, 86 67 C 73 67, 62 76, 60.5 92 Z"/>
      <g class="bud"><ellipse cx="60" cy="60" rx="7.5" ry="9.5"/><ellipse class="bud2" cx="57.5" cy="57" rx="2.6" ry="4"/></g>
    </g></svg>
    <div class="wm">UNDERSKIN</div>
    <div class="bar"><i></i></div>
  </div>
</div>
<script>
  // stays at least until the sprout has grown, and until the app has drawn its first screen
  (function () {
    var t0 = Date.now(), calm = matchMedia('(prefers-reduced-motion: reduce)').matches, min = calm ? 450 : 1650, done = false;
    function hide() { if (done) return; done = true; var el = document.getElementById('splash'); if (!el) return;
      setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 650); }, Math.max(0, min - (Date.now() - t0))); }
    window.__appReady = hide;
    setTimeout(hide, 7000); // never trap her behind it
  })();
</script>
