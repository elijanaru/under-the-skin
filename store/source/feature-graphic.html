<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1024px;height:500px;overflow:hidden;background:#000;font-family:Outfit,sans-serif;color:#f4f5f0}
.bg{position:absolute;inset:0;background:radial-gradient(60% 90% at 78% 40%,rgba(47,107,72,.75),transparent 70%),radial-gradient(40% 60% at 10% 100%,rgba(47,107,72,.35),transparent 70%)}
.orb{position:absolute;width:260px;height:260px;border-radius:50%;right:150px;top:60px;background:radial-gradient(circle,rgba(212,239,154,.35),transparent 65%);filter:blur(10px)}
.hud{position:absolute;left:72px;top:64px;font-size:13px;letter-spacing:.3em;color:rgba(212,239,154,.8)}
.line{position:absolute;left:72px;right:420px;top:96px;height:1px;background:linear-gradient(90deg,rgba(212,239,154,.6),transparent)}
.txt{position:absolute;left:72px;top:150px;width:480px}
.icon{width:64px;height:64px;border-radius:16px;box-shadow:0 0 30px rgba(212,239,154,.3);margin-bottom:22px}
h1{font-weight:200;font-size:72px;letter-spacing:-.03em;line-height:1}
p{margin-top:18px;font-weight:300;font-size:26px;line-height:1.3;color:#c3cac1}
p b{font-weight:400;color:#d4ef9a}
.phone{position:absolute;right:96px;top:46px;width:250px;height:520px;border-radius:40px;overflow:hidden;border:6px solid #1b1f1b;box-shadow:0 30px 80px rgba(0,0,0,.8),0 0 60px rgba(212,239,154,.18);transform:rotate(4deg)}
.phone img{width:100%;display:block}
</style></head><body>
<div class="bg"></div><div class="orb"></div>
<div class="hud">CYCLE · HORMONES · ENERGY</div><div class="line"></div>
<div class="txt"><img class="icon" src="../../icons/icon-512.png"><h1>Underskin</h1><p>Know when to <b>push</b><br>and when to <b>slow down</b>.</p></div>
<div class="phone"><img src="../android-phone/02-today.png"></div>
</body></html>
