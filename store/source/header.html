p{position:absolute;top:224px;width:100%;text-align:center;font-weight:300;font-size:30px;color:#c3cac1;letter-spacing:.005em}

.ph{position:absolute;width:236px;aspect-ratio:1320/2868;border-radius:38px;overflow:hidden;border:5px solid #1b1f1b;background:#000;

.tag{position:absolute;font-size:12px;letter-spacing:.35em;color:rgba(159,207,140,.75)}
